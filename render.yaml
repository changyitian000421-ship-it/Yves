services:
  - type: web
    name: calcium-chloride-leads
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: LOGIN_PHONES
        sync: false
      - key: AMAP_KEY
        sync: false
      - key: BAIDU_MAP_AK
        sync: false
      - key: TIANDITU_TK
        sync: false
      - key: BAIDU_SEARCH_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ALIYUN_PNVS_ACCESS_KEY_ID
        sync: false
      - key: ALIYUN_PNVS_ACCESS_KEY_SECRET
        sync: false
      - key: ALIYUN_PNVS_SCHEME_NAME
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: AMAP_WORKERS
        value: "4"
      - key: BAIDU_MAP_WORKERS
        value: "4"
      - key: TIANDITU_WORKERS
        value: "4"
      - key: BAIDU_SEARCH_DAILY_LIMIT
        value: "45"
      - key: BAIDU_SEARCH_CACHE_DAYS
        value: "7"
