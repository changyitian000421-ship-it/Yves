<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · 氯化钙产业线索采集器</title>
    <link rel="stylesheet" href="/styles.css?v=pnvs-login-1" />
  </head>
  <body class="login-page">
    <main class="login-panel">
      <div class="brand">
        <div class="mark">Ca</div>
        <div>
          <h1>氯化钙产业线索采集器</h1>
          <p>销售团队登录</p>
        </div>
      </div>

      <form id="login-form" class="login-form">
        <label class="field">
          <span>手机号码</span>
          <input
            id="phone"
            type="tel"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="13"
            placeholder="请输入接收验证码的手机号"
            autofocus
            required
          />
        </label>
        <label class="field">
          <span>访问密码</span>
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <label class="field">
          <span>手机验证码</span>
          <div class="verification-row">
            <input
              id="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              placeholder="6 位验证码"
              required
            />
            <button id="send-code" class="secondary verification-button" type="button">
              获取验证码
            </button>
          </div>
        </label>
        <button class="primary" type="submit">登录</button>
        <p id="login-status" class="login-status" role="status"></p>
        <p id="login-error" class="login-error" role="alert"></p>
      </form>
    </main>
    <script src="/login.js?v=pnvs-login-1"></script>
  </body>
</html>
